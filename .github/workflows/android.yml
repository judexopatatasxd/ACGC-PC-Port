name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "pc/**"
      - "src/**"
      - "include/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources and SDL2
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # This port and the pinned SDL2 submodule use the same older,
          # known-good wrapper JAR, which is not in the action's checksum list.
          validate-wrappers: false

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Animal-Crossing-Port-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animal-Crossing-Port-Android
          path: Animal-Crossing-Port-Android.apk
          if-no-files-found: error
