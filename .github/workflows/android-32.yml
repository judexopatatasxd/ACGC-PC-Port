name: Build Android APK 32-bit

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - v2-32bit-hand-control
    paths:
      - "android/**"
      - "pc/**"
      - "src/**"
      - "include/**"
      - ".github/workflows/android-32.yml"
      - ".github/workflows/android-64.yml"

jobs:
  apk-32:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/v2-32bit-hand-control'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources and SDL2
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Prepare stable signing key
        env:
          ACGC_SIGNING_KEY: ${{ secrets.ACGC_SIGNING_KEY }}
          ACGC_SIGNING_PASSWORD: ${{ secrets.ACGC_SIGNING_PASSWORD }}
        run: |
          if [ -n "$ACGC_SIGNING_KEY" ] && [ -n "$ACGC_SIGNING_PASSWORD" ]; then
            printf '%s' "$ACGC_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/acgc-signing.p12"
            echo "ACGC_KEYSTORE_PATH=$RUNNER_TEMP/acgc-signing.p12" >> "$GITHUB_ENV"
            echo "ACGC_KEYSTORE_PASSWORD=$ACGC_SIGNING_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build 32-bit debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify 32-bit APK and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          CHECK_DIR="$RUNNER_TEMP/acgc-apk-check"
          mkdir -p "$CHECK_DIR"
          unzip -q "$APK" "lib/*" -d "$CHECK_DIR"

          test -f "$CHECK_DIR/lib/armeabi-v7a/libmain.so"
          UNEXPECTED_ABIS="$(find "$CHECK_DIR/lib" -mindepth 1 -maxdepth 1 -type d ! -name armeabi-v7a -print)"
          test -z "$UNEXPECTED_ABIS"
          readelf -h "$CHECK_DIR/lib/armeabi-v7a/libmain.so" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$CHECK_DIR/lib/armeabi-v7a/libmain.so" | grep -Eq 'Machine:[[:space:]]+ARM'

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Name 32-bit APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Animal-Crossing-Port-Android-32bit.apk

      - name: Upload 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: Animal-Crossing-Port-Android-32bit
          path: Animal-Crossing-Port-Android-32bit.apk
          if-no-files-found: error
